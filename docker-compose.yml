services:

  db:
    image: postgres:16-alpine
    container_name: churn_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" — stays fully private, reachable only by backend internally.

  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: churn_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/churn_logs
    depends_on:
      - db
    ports:
      - "8000:8000"   # exposed for direct API testing (curl/Postman)

  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    container_name: churn_frontend
    restart: unless-stopped
    environment:
      CHURN_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "80:8501"   # main public entry point for the app

volumes:
  pgdata:
    driver: local